name: Foundation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s python/tests -v
      - run: python -m py_compile python/worker.py python/tests/test_worker.py
      - run: python -m pip install ruff==0.15.20
      - run: python -m ruff check python test/fixtures
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
